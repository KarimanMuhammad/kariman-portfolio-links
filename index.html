<title>Kariman | Portfolio Links</title>
<style>
:root{color-scheme:dark;--ink:#080808;--accent:#c4bdb8;--muted:#c4bdb8}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080808;
font-family:Arial,Helvetica,sans-serif;color:var(--accent);padding:28px}
main{width:min(680px,100%);text-align:center}
h1{font-size:clamp(25px,5vw,38px);margin:0 0 10px;color:var(--accent);letter-spacing:.02em}
.links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:32px}
a{color:var(--accent);text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:12px;
padding:24px 12px;border:1.5px solid var(--accent);border-radius:22px;background:#101010;
transition:transform .18s ease,background .18s ease}
a:hover{transform:translateY(-4px);background:#1a1817}
.icon{width:68px;height:68px;display:grid;place-items:center}
.icon svg{width:58px;height:58px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.label{font-size:16px;font-weight:700;letter-spacing:.03em}
@media(max-width:420px){.links{gap:12px}a{padding:18px 8px}.icon{width:58px;height:58px}}
</style>
</head>
